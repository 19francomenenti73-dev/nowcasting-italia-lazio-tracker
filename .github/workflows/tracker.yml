name: Lazio Storm Tracker Automator

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione Tracker Radar
        run: python tracker.py

      - name: Commit e Push automatico del GeoJSON aggiornato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cells.geojson
          git diff --staged --quiet || git commit -m "Auto-update: Nuove celle radar elaborate [skip ci]"
          git push
          
