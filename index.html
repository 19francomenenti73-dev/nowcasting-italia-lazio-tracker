<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <title>Lazio 3D Storm Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- MapLibre GL JS CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #map {
            width: 100%;
            height: 650px; /* Altezza fissa ideale per l'incorporamento via iframe */
        }
        .maplibregl-popup-content {
            background: rgba(20, 20, 20, 0.95);
            color: #fff;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            font-size: 13px;
            line-height: 1.4;
        }
        .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(20, 20, 20, 0.95); }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(20, 20, 20, 0.95); }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- MapLibre GL JS Script -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'raster-tiles': {
                        type: 'raster',
                        tiles: [
                            'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                        ],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap Contributors'
                    },
                    'terrain-source': {
                        type: 'raster-dem',
                        tiles: [
                            'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'
                        ],
                        tileSize: 256,
                        maxzoom: 15
                    }
                },
                layers: [
                    {
                        id: 'simple-tile',
                        type: 'raster',
                        source: 'raster-tiles',
                        minzoom: 0,
                        maxzoom: 22
                    }
                ],
                terrain: {
                    source: 'terrain-source',
                    exaggeration: 1.5
                }
            },
            center: [12.5674, 41.9028], // Centro approssimativo Lazio / Roma
            zoom: 8,
            pitch: 45,
            bearing: -15
        });

        map.on('load', () => {
            // Aggiunta sorgente dati GeoJSON generati dal backend Python
            map.addSource('cells', {
                type: 'geojson',
                data: 'cells.geojson'
            });

            // Layer 3D per le celle temporalesche
            map.addLayer({
                id: 'cells-extrusion',
                type: 'fill-extrusion',
                source: 'cells',
                paint: {
                    'fill-extrusion-color': ['get', 'color'],
                    'fill-extrusion-height': ['get', 'height'],
                    'fill-extrusion-base': 0,
                    'fill-extrusion-opacity': 0.85
                }
            });

            // Gestione click per i popup con i parametri diagnostici
            map.on('click', 'cells-extrusion', (e) => {
                const props = e.features[0].properties;
                const html = `
                    <strong><b>ID Cella:</b> ${props.id || 'N/D'}</strong><br>
                    <b>Stadio (Lifecycle):</b> ${props.lifecycle || 'N/D'}<br>
                    <b>Echo Top (ET):</b> ${props.et || 'N/D'} km<br>
                    <b>VIL:</b> ${props.vil || 'N/D'} kg/m²<br>
                    <b>QPE (Rain Rate):</b> ${props.qpe || 'N/D'} mm/h<br>
                    <b>Flash Rate Proxy:</b> ${props.flash_rate || 'N/D'} fl/min<br>
                    <b>ETA Roma:</b> ${props.eta_rome || 'N/D'} min<br>
                    <b>CEP (Incertezza):</b> ${props.cep || 'N/D'} km
                `;
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(html)
                    .addTo(map);
            });

            map.on('mouseenter', 'cells-extrusion', () => {
                map.getCanvas().style.cursor = 'pointer';
            });
            map.on('mouseleave', 'cells-extrusion', () => {
                map.getCanvas().style.cursor = '';
            });
        });

        // Forza il ridimensionamento della mappa per renderizzarla correttamente dentro i contesti iframe
        setTimeout(() => {
            map.resize();
        }, 400);
    </script>
</body>
</html>
